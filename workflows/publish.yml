name: Publish Creative Intelligence Magazine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "automation/**"
      - "tests/**"
      - "styles.css"
      - "script.js"
      - "assets/**"
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: creative-intelligence-publisher
  cancel-in-progress: false

permissions:
  contents: write
  copilot-requests: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out magazine
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Gather fresh candidates
        run: python automation/fetch_candidates.py
      - name: Build editorial brief
        run: python automation/build_prompt.py
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Curate the issue
        id: curate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: copilot -p "$(cat .cache/editorial-prompt.md)" -s > .cache/copilot-output.txt
      - name: Validate curation or use deterministic fallback
        run: python automation/normalize_curation.py
      - name: Render site, archive and RSS
        run: python automation/render_site.py
      - name: Verify generated output
        run: |
          python -m unittest discover -s tests -v
          test -s index.html
          test -s feed.xml
          test -s data/latest.json
      - name: Commit the new edition
        run: |
          git config user.name "Creative Intelligence Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html archive weekly feed.xml data
          if git diff --cached --quiet; then
            echo "No editorial changes to publish."
          else
            ISSUE_DATE=$(python -c 'import json; print(json.load(open("data/latest.json"))["date"])')
            git commit -m "Publish Creative Intelligence issue ${ISSUE_DATE}"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
