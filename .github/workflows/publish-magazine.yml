name: Publish Morning Edition

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional weekday date in YYYY-MM-DD"
        required: false
        type: string
  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: publish-morning-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate daily edition and summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAGAZINE_DATE: ${{ github.event.inputs.run_date }}
          OPENAI_MODEL: gpt-5
          EDITION_TYPE: daily
        run: node ./scripts/generate-magazine.mjs

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archives summaries images
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish Morning Edition for ${MAGAZINE_DATE:-$(date -u +%F)}"
          git push