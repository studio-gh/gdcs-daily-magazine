name: Publish Creative Intelligence Magazine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "automation/**"
      - "tests/**"
      - "styles.css"
      - "script.js"
      - "assets/**"
  schedule:
    # Run off the top of the hour to reduce GitHub scheduler congestion.
    # 11:17 UTC is 08:17 in Sao Paulo; 13:47 UTC is a same-day retry.
    - cron: "17 11 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:

concurrency:
  group: creative-intelligence-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out magazine
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Locate the automation bundle
        run: |
          if test -d automation; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif test -d gdcs-daily-magazine-automated/automation; then
            echo "APP_DIR=gdcs-daily-magazine-automated" >> "$GITHUB_ENV"
          else
            echo "The automation folder is missing." >&2
            exit 1
          fi
      - name: Gather fresh candidates
        run: |
          python "$APP_DIR/automation/fetch_candidates.py" \
            --sources "$APP_DIR/automation/sources.json" \
            --output "$APP_DIR/.cache/candidates.json"
      - name: Curate and deduplicate the edition
        run: |
          python "$APP_DIR/automation/normalize_curation.py" \
            --raw "$APP_DIR/.cache/copilot-output.txt" \
            --candidates "$APP_DIR/.cache/candidates.json" \
            --output "$APP_DIR/data/latest.json"
      - name: Render site, archive and RSS
        run: |
          python "$APP_DIR/automation/render_site.py" \
            --issue "$APP_DIR/data/latest.json" \
            --root "."
          if test "$APP_DIR" != "."; then
            mkdir -p data
            cp "$APP_DIR/data/latest.json" data/latest.json
          fi
      - name: Verify generated output
        run: |
          (cd "$APP_DIR" && python -m unittest discover -s tests -v)
          test -s index.html
          test -s feed.xml
          test -s data/latest.json
      - name: Commit the new edition
        run: |
          git config user.name "Creative Intelligence Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html archive weekly feed.xml data
          if git diff --cached --quiet; then
            echo "No editorial changes to publish."
          else
            ISSUE_DATE=$(python -c 'import json; print(json.load(open("data/latest.json"))["date"])')
            git commit -m "Publish Creative Intelligence issue ${ISSUE_DATE}"
            git push
          fi
