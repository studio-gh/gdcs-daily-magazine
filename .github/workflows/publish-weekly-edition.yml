name: Publish Weekly Edition

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional Friday date in YYYY-MM-DD"
        required: false
        type: string
  schedule:
    - cron: "0 10 * * 5"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

concurrency:
  group: publish-weekly-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate weekly edition and summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAGAZINE_DATE: ${{ github.event.inputs.run_date }}
          OPENAI_MODEL: gpt-5
          EDITION_TYPE: weekly
        run: node ./scripts/generate-magazine.mjs

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly weekly-summaries images
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish Weekly Edition for $(date -u +%F)"
          git push